<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Geospatial File Measurement</title>

<!-- Leaflet. Pinned, loaded from a CDN, and entirely optional: if it fails to
     load the page still renders the full measurement table. See renderMap(). -->
<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      crossorigin="anonymous" referrerpolicy="no-referrer" />

<style>
  /* ---------------------------------------------------------------
     Single-file UI. No build step and no framework -- it is served
     directly by the API at "/", so the repo stays runnable with one
     command. Leaflet is the only external dependency and the page
     degrades gracefully without it.
     --------------------------------------------------------------- */
  :root {
    --bg:        #0f1216;
    --surface:   #161b22;
    --surface-2: #1c232c;
    --border:    #2a333f;
    --text:      #e6edf3;
    --muted:     #8b98a8;
    --accent:    #4f9cf9;
    --accent-dim:#1d3a5f;
    --ok:        #3fb950;
    --warn:      #d29922;
    --err:       #f85149;
    --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#f6f8fa; --surface:#ffffff; --surface-2:#f0f3f6; --border:#d8dee4;
      --text:#1f2328; --muted:#636c76; --accent:#0969da; --accent-dim:#ddf0ff;
      --ok:#1a7f37; --warn:#9a6700; --err:#cf222e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 40px 16px 80px; }

  header { margin-bottom: 28px; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .sub a { color: var(--accent); }

  /* --- drop zone --- */
  #drop {
    border: 1.5px dashed var(--border); border-radius: var(--radius);
    background: var(--surface); padding: 40px 24px; text-align: center;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.hot { border-color: var(--accent); background: var(--surface-2); }
  #drop h2 { font-size: 16px; margin: 0 0 6px; font-weight: 600; }
  #drop p { margin: 0; color: var(--muted); font-size: 13px; }
  #drop code {
    font-family: var(--mono); font-size: 12px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
  }
  input[type=file] { display: none; }

  /* --- status --- */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; margin-top: 20px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: baseline; }
  .kv { font-size: 13px; }
  .kv b { color: var(--muted); font-weight: 500; margin-right: 6px; }
  .kv span { font-family: var(--mono); font-size: 12.5px; }

  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; letter-spacing: .03em;
    border: 1px solid transparent;
  }
  .pill.PENDING, .pill.PROCESSING { background: var(--accent-dim); color: var(--accent); }
  .pill.COMPLETED { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
  .pill.FAILED    { background: color-mix(in srgb, var(--err) 16%, transparent); color: var(--err); }

  .note {
    margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 13px;
    border-left: 3px solid var(--warn);
    background: color-mix(in srgb, var(--warn) 10%, transparent);
  }
  .note.err { border-left-color: var(--err); background: color-mix(in srgb, var(--err) 10%, transparent); }

  /* --- summary tiles --- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-top: 18px; }
  .tile { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .tile b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .tile span { display: block; font-family: var(--mono); font-size: 17px; margin-top: 4px; }

  /* --- map --- */
  #map {
    height: 420px; margin-top: 18px; border-radius: var(--radius);
    border: 1px solid var(--border); background: var(--surface-2);
    z-index: 0;   /* keep Leaflet panes below any page chrome */
  }
  .leaflet-container { font: inherit; border-radius: var(--radius); }
  .leaflet-popup-content { margin: 10px 12px; font-size: 13px; line-height: 1.5; }
  .leaflet-popup-content b { font-size: 13px; }
  .leaflet-popup-content .m { font-family: var(--mono); font-size: 12px; color: #444; }
  .maphint { margin-top: 8px; font-size: 12.5px; color: var(--muted); }

  /* --- table --- */
  .scroll { overflow-x: auto; margin-top: 18px; border: 1px solid var(--border); border-radius: var(--radius); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { background: var(--surface-2); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; position: sticky; top: 0; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr.locatable { cursor: pointer; }
  tbody tr.active { background: var(--accent-dim); }
  td.num { font-family: var(--mono); text-align: right; }
  td.dim { color: var(--muted); }
  .tag { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--border); }

  footer { margin-top: 36px; color: var(--muted); font-size: 12.5px; }
  footer a { color: var(--accent); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Geospatial File Measurement</h1>
    <p class="sub">
      Upload a Shapefile or KML and get per-feature area and length.
      Full API reference at <a href="/docs">/docs</a>.
    </p>
  </header>

  <div id="drop" role="button" tabindex="0" aria-label="Upload a geospatial file">
    <h2>Drop a file here, or click to browse</h2>
    <p>Accepts <code>.zip</code> (Shapefile), <code>.kml</code> and <code>.kmz</code></p>
  </div>
  <input type="file" id="picker" accept=".zip,.kml,.kmz" />

  <section id="status" class="card hidden"></section>
  <section id="summary" class="hidden"></section>
  <div id="map" class="hidden"></div>
  <p id="maphint" class="maphint hidden">Click a row to zoom to that feature.</p>
  <div id="table" class="scroll hidden"></div>

  <footer id="foot" class="hidden"></footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(() => {
  "use strict";

  const drop    = document.getElementById("drop");
  const picker  = document.getElementById("picker");
  const statusEl= document.getElementById("status");
  const sumEl   = document.getElementById("summary");
  const mapEl   = document.getElementById("map");
  const hintEl  = document.getElementById("maphint");
  const tableEl = document.getElementById("table");
  const footEl  = document.getElementById("foot");

  const POLL_MS = 600;
  const POLL_LIMIT = 100;          // ~60s ceiling, then stop and report

  let map = null;                  // Leaflet map instance, created lazily
  let layerByIndex = new Map();    // feature_index -> Leaflet layer

  // --- wiring ------------------------------------------------------------
  drop.addEventListener("click", () => picker.click());
  drop.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); picker.click(); }
  });
  picker.addEventListener("change", () => {
    if (picker.files.length) upload(picker.files[0]);
  });
  ["dragenter","dragover"].forEach(t =>
    drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("hot"); }));
  ["dragleave","drop"].forEach(t =>
    drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("hot"); }));
  drop.addEventListener("drop", e => {
    const f = e.dataTransfer?.files?.[0];
    if (f) upload(f);
  });

  // --- flow --------------------------------------------------------------
  async function upload(file) {
    reset();
    show(statusEl);
    statusEl.innerHTML = `<div class="row"><div class="kv"><b>Uploading</b><span>${esc(file.name)}</span></div></div>`;

    const body = new FormData();
    body.append("file", file);

    let accepted;
    try {
      const res = await fetch("/api/files/", { method: "POST", body });
      accepted = await res.json();
      if (!res.ok) return fail(accepted?.error?.message || "Upload failed", accepted?.error?.detail);
    } catch (err) {
      return fail("Could not reach the API.", String(err));
    }

    renderStatus(accepted);
    poll(accepted.id);
  }

  async function poll(id) {
    for (let i = 0; i < POLL_LIMIT; i++) {
      await sleep(POLL_MS);
      let info;
      try {
        const res = await fetch(`/api/files/${id}/`);
        info = await res.json();
        if (!res.ok) return fail(info?.error?.message || "Lookup failed");
      } catch (err) {
        return fail("Lost connection to the API.", String(err));
      }

      renderStatus(info);

      if (info.status === "COMPLETED") return loadResults(id);
      if (info.status === "FAILED")    return fail(info.error_message || "Processing failed.");
    }
    fail("Timed out waiting for processing to finish.");
  }

  async function loadResults(id) {
    let data;
    try {
      const res = await fetch(`/api/files/${id}/measurements/?limit=500`);
      data = await res.json();
      if (!res.ok) return fail(data?.error?.message || "Could not load measurements");
    } catch (err) {
      return fail("Could not load measurements.", String(err));
    }

    renderSummary(data.summary);
    renderTable(data.measurements);
    renderFooter(id, data);

    // The map is additive: it is fetched separately and any failure here
    // leaves the measurements above fully intact.
    loadMap(id).catch(err => console.warn("Map unavailable:", err));
  }

  // --- map ---------------------------------------------------------------
  async function loadMap(id) {
    if (typeof L === "undefined") return;      // CDN blocked or offline

    const res = await fetch(`/api/files/${id}/features/?limit=500`);
    if (!res.ok) return;
    const collection = await res.json();

    const drawable = (collection.features || []).filter(
      f => f.geometry && f.geometry.type && !f.geometry.truncated
    );
    if (!drawable.length) return;

    show(mapEl);
    show(hintEl);

    map = L.map(mapEl, { scrollWheelZoom: false });

    // Both tile sources are keyless. Satellite imagery is offered alongside the
    // street map because it is the more useful backdrop for survey and
    // drone-derived data -- you can see the ground the geometry describes.
    const street = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    });
    const satellite = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom: 19, attribution: "Imagery &copy; Esri" }
    );

    street.addTo(map);
    L.control
      .layers({ Street: street, Satellite: satellite }, null, { collapsed: false })
      .addTo(map);

    const accent = getComputedStyle(document.documentElement)
      .getPropertyValue("--accent").trim() || "#4f9cf9";

    const geo = L.geoJSON(
      { type: "FeatureCollection", features: drawable },
      {
        style: { color: accent, weight: 2.5, opacity: 0.9, fillOpacity: 0.18 },
        pointToLayer: (_, latlng) =>
          L.circleMarker(latlng, {
            radius: 6, color: accent, weight: 2, fillOpacity: 0.7,
          }),
        onEachFeature: (feature, layer) => {
          const p = feature.properties || {};
          layer.bindPopup(popupHtml(p));
          if (typeof p._feature_index === "number") {
            layerByIndex.set(p._feature_index, layer);
          }
        },
      }
    ).addTo(map);

    map.fitBounds(geo.getBounds(), { padding: [28, 28], maxZoom: 17 });
    // The container is sized by CSS after Leaflet measures it, so nudge it.
    setTimeout(() => map.invalidateSize(), 0);

    markLocatableRows();
  }

  function popupHtml(p) {
    const m = p._measurement || {};
    const lines = [];
    if (p.name) lines.push(esc(p.name));
    if (m.area_sqm != null)   lines.push(`Area ${fmt(m.area_sqm)} m² (${fmt(m.area_hectares)} ha)`);
    if (m.perimeter_m != null) lines.push(`Perimeter ${fmt(m.perimeter_m)} m`);
    if (m.length_m != null)   lines.push(`Length ${fmt(m.length_m)} m`);
    if (m.measurement_crs)    lines.push(`Measured in ${esc(m.measurement_crs)}`);
    if (!lines.length)        lines.push("No measurement for this geometry type.");

    return `<b>${esc(p._geometry_type || "Feature")}</b><br>` +
           `<span class="m">${lines.join("<br>")}</span>`;
  }

  function markLocatableRows() {
    document.querySelectorAll("#table tbody tr").forEach(tr => {
      const index = Number(tr.dataset.index);
      if (!layerByIndex.has(index)) return;

      tr.classList.add("locatable");
      tr.addEventListener("click", () => {
        const layer = layerByIndex.get(index);
        document.querySelectorAll("#table tbody tr.active")
                .forEach(r => r.classList.remove("active"));
        tr.classList.add("active");

        if (layer.getBounds) {
          map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 18 });
        } else {
          map.setView(layer.getLatLng(), 17);
        }
        layer.openPopup();
        mapEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    });
  }

  // --- rendering ---------------------------------------------------------
  function renderStatus(info) {
    show(statusEl);
    const bits = [
      kv("File", info.filename),
      kv("Id", info.id),
      kv("Type", info.file_type),
      kv("Size", bytes(info.size_bytes)),
    ];
    if (info.crs) bits.push(kv("Source CRS", info.crs));
    if (typeof info.feature_count === "number" && info.feature_count)
      bits.push(kv("Features", info.feature_count));
    if (info.processing_duration_seconds != null)
      bits.push(kv("Took", info.processing_duration_seconds.toFixed(3) + " s"));

    let html = `<div class="row">
        <span class="pill ${esc(info.status)}">${esc(info.status)}</span>
        ${bits.join("")}
      </div>`;

    for (const w of info.warnings || []) {
      html += `<div class="note">${esc(w)}</div>`;
    }
    statusEl.innerHTML = html;
  }

  function renderSummary(s) {
    show(sumEl);
    const tiles = [
      ["Features", s.feature_count],
      ["Measured", s.measured_count],
      ["Unsupported", s.unsupported_count],
    ];
    if (s.total_area_sqm)  tiles.push(["Total area", fmt(s.total_area_sqm) + " m²"]);
    if (s.total_area_sqm)  tiles.push(["", fmt(s.total_area_hectares) + " ha"]);
    if (s.total_length_m)  tiles.push(["Total length", fmt(s.total_length_m) + " m"]);

    const types = Object.entries(s.geometry_type_counts || {})
      .map(([t, c]) => `${t} × ${c}`).join(", ");

    sumEl.innerHTML = `
      <div class="tiles">
        ${tiles.map(([k, v]) => `<div class="tile"><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join("")}
      </div>
      <div class="card" style="margin-top:12px">
        <div class="row">
          ${kv("Geometry", types || "none")}
          ${kv("Methods", (s.measurement_methods_used || []).join(", ") || "none")}
        </div>
      </div>`;
  }

  function renderTable(rows) {
    show(tableEl);
    if (!rows.length) {
      tableEl.innerHTML = `<table><tbody><tr><td class="dim">No features found.</td></tr></tbody></table>`;
      return;
    }
    const head = ["#", "ID", "Geometry", "Area (m²)", "Area (ha)", "Perimeter (m)",
                  "Length (m)", "CRS used", "Method"];

    const body = rows.map(r => {
      const m = r.measurement || {};
      const unsupported = !r.supported;
      return `<tr data-index="${r.feature_index}"${
        unsupported ? ' title="' + esc(r.skip_reason || "") + '"' : ""}>
        <td class="num dim">${r.feature_index}</td>
        <td>${esc(r.feature_id ?? "—")}</td>
        <td><span class="tag">${esc(r.geometry_type)}</span></td>
        <td class="num">${num(m.area_sqm)}</td>
        <td class="num">${num(m.area_hectares)}</td>
        <td class="num">${num(m.perimeter_m)}</td>
        <td class="num">${num(m.length_m)}</td>
        <td class="dim">${esc(m.measurement_crs ?? "—")}</td>
        <td class="dim">${esc(m.measurement_method ?? "—")}</td>
      </tr>`;
    }).join("");

    tableEl.innerHTML =
      `<table><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead>
       <tbody>${body}</tbody></table>`;
  }

  function renderFooter(id, data) {
    show(footEl);
    footEl.innerHTML =
      `Showing ${data.measurements.length} of ${data.pagination.total} features &middot;
       <a href="/api/files/${id}/measurements/" target="_blank" rel="noopener">raw JSON</a> &middot;
       <a href="/api/files/${id}/features/" target="_blank" rel="noopener">GeoJSON</a>`;
  }

  function fail(message, detail) {
    show(statusEl);
    statusEl.innerHTML += `<div class="note err"><b>${esc(message)}</b>${
      detail ? `<br><span style="font-family:var(--mono);font-size:12px">${esc(
        typeof detail === "string" ? detail : JSON.stringify(detail))}</span>` : ""
    }</div>`;
  }

  // --- helpers -----------------------------------------------------------
  function reset() {
    if (map) { map.remove(); map = null; }
    layerByIndex = new Map();
    [sumEl, tableEl, footEl, mapEl, hintEl].forEach(el => {
      el.classList.add("hidden");
      if (el !== mapEl) el.innerHTML = "";
    });
    mapEl.innerHTML = "";
    statusEl.innerHTML = "";
  }
  const show  = el => el.classList.remove("hidden");
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const kv    = (k, v) => `<div class="kv"><b>${esc(k)}</b><span>${esc(v)}</span></div>`;

  function esc(v) {
    return String(v ?? "").replace(/[&<>"']/g,
      c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  }
  function num(v) {
    return v == null ? '<span class="dim">—</span>' : fmt(v);
  }
  function fmt(v) {
    return Number(v).toLocaleString(undefined, { maximumFractionDigits: 2 });
  }
  function bytes(n) {
    if (!n) return "0 B";
    const u = ["B","KB","MB","GB"], i = Math.min(u.length - 1, Math.floor(Math.log(n) / Math.log(1024)));
    return (n / 1024 ** i).toFixed(i ? 1 : 0) + " " + u[i];
  }
})();
</script>
</body>
</html>
